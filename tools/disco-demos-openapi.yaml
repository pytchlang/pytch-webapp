        "404":
          $ref: "#/components/responses/NotFound"
  /{uuid}/{language}/content/{thumbnailFilename}:
    x-demo-versions: live
    get:
      operationId: getDemoThumbnail
      summary: Fetch the demo's thumbnail image or preview video.
      description: "Source: `demoThumbnailImageUrl(demo)` and `maybeDemoThumbnailVideoUrl(demo)`.  The filename is the literal stem `thumbnail` followed by the extension from the catalogue entry (`thumbnailImageExtension`, or `thumbnailVideoExtension` for the preview video); the leading dot is part of the stored value."
      parameters:
        - name: uuid
          in: path
          required: true
          description: The demo's `uuid` (as carried in its catalogue entry).
          schema:
            type: string
        - name: language
          in: path
          required: true
          description: Content language code.  Currently always "en"; templated to allow future localisation.

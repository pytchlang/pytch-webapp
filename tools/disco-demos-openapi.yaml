            default: en
            examples:
              - en
        - name: thumbnailFilename
          in: path
          required: true
          description: "`thumbnail` + the extension from the catalogue entry, e.g. `thumbnail.png` or `thumbnail.mp4`."
          schema:
            type: string
            pattern: ^thumbnail\.[A-Za-z0-9]+$
            examples:
              - thumbnail.png
              - thumbnail.mp4
      responses:
        "200":
          description: The thumbnail image or preview video (binary).
          content:
            image/*:
              schema:
                type: string
                format: binary
            video/*:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters: {}
  responses:
    NotFound:
      description: Resource does not exist.  Inferred, not directly asserted by the client; the client treats any non-OK fetch as an error fetch-state.
  schemas:
    DemoCatalogue:
      type: array
      description: The catalogue index — every published demo entry.
      items:
        $ref: "#/components/schemas/DemoCatalogueEntry"
    DemoCatalogueEntry:
      type: object
      properties:
        uuid:
          type: string
          description: Stable identifier for this specific version of the demo.
        displayName:
          type: string
          description: Human-readable name; used for display and A-to-Z sort.
        authorName:
          type: string
        programKind:
          type: string
          enum:
            - flat
            - per-method
          description: Pytch program kind (zPytchProgramKind).
        demoKind:
          type: string
          enum:
            - game
            - snippet
        summaryMarkdown:
          type: string
          description: Short summary.  Named "...Markdown", but note the current UI renders it as raw text in the cards and sidebar subheader (only chapter headings/content are markdown-rendered).
        lastUpdated:
          type: string
          description: Last-updated timestamp.  Consumed via `new Date(...)` (for descending "Last Updated" sort) and `date-fns` `format(..., "PP")`, so must be a Date-parseable string (ISO 8601 date or date-time).
          format: date-time
        recommended:
          type: boolean
          description: Whether the demo appears in the Recommended carousel.
        thumbnailImageExtension:
          type: string
          description: File extension (including leading dot) of the thumbnail image, used to build the thumbnail image URL, e.g. ".png".
          examples:
            - .png
            - .jpg
        thumbnailVideoExtension:
          anyOf:
            - type: "null"
            - type: string
          description: File extension (including leading dot) of the optional preview video, or null when the demo has no preview video.
          examples:
            - .mp4
            - null
        latestUuid:
          anyOf:
            - type: "null"
            - type: string
          description: uuid of the latest version of this demo (may equal `uuid` if this demo-major-version is the latest one; may be `null` if this demo has been removed from the catalogue).
      required:
        - uuid
        - displayName
        - authorName
        - programKind
        - demoKind
        - summaryMarkdown
        - lastUpdated
        - recommended
        - thumbnailImageExtension
        - thumbnailVideoExtension
        - latestUuid
      additionalProperties: false
      description: "One demo's catalogue entry.  Mirrors the Zod `zDemoCatalogueEntry` strict object: no additional properties are permitted, and every listed property is required."

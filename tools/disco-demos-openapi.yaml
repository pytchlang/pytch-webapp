openapi: 3.1.0
info:
  title: Pytch Discoverable Demos — content/catalogue API
  version: 0.1.0-inferred
  description: "Static content feed serving the discoverable-demos catalogue index and the per-demo resources (metadata, project zipfile, description markdown, and thumbnail image/video).  The catalogue JSON shapes in this document are generated from the webapp's Zod schema (`zDemoCatalogueEntry` in src/model/discoverable-demos-schema.ts) by scripts/generate-demos-openapi.ts; that schema is the source of truth.  Per-demo paths carry an `x-demo-versions` extension: \"all\" = served for every version directory (including superseded ones), \"live\" = served only for UUIDs listed in the catalogue index."
servers:
  - url: "{demoCatalogueBase}"
    description: Value of the VITE_DEMO_CATALOGUE_BASE environment variable.
    variables:
      demoCatalogueBase:
        default: http://localhost:8124
        description: Root of the demo catalogue server.  Set per-environment via VITE_DEMO_CATALOGUE_BASE; the value shown is a placeholder.
paths:
  /index/{language}/demos.json:
    get:
      operationId: getDemoCatalogue
      summary: Fetch the demo catalogue index.
      description: "Source: `demosIndexUrl(language)`, consumed by the demos list page via the `discoverableDemos.fetchedDemos` external-JSON slice.  Parsed with `zDemoCatalogue` (an array of catalogue entries)."
      parameters:
        - name: language
          in: path

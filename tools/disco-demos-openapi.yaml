              - en
      responses:
        "200":
          description: The demo's catalogue entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCatalogueEntry"
        "404":
          $ref: "#/components/responses/NotFound"
  /{uuid}/{language}/project.zip:
    x-demo-versions: live
    get:
      operationId: getDemoProjectZip
      summary: Fetch the demo's project as a zipfile.
      description: "Source: `demoProjectZipfileUrl(uuid)`, fetched as an ArrayBuffer by `createProjectFromDemoFlow` and decoded by `projectDescriptor`.  Seeds a new project linked to the demo."
      parameters:
        - name: uuid
          in: path
          required: true
          description: The demo's `uuid` (as carried in its catalogue entry).
          schema:
            type: string
        - name: language
          in: path
          required: true
          description: Content language code.  Currently always "en"; templated to allow future localisation.
          schema:
            type: string
            default: en
            examples:
              - en
      responses:
        "200":
          description: The project zipfile (binary).
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /{uuid}/{language}/content/description.md:
    x-demo-versions: all
    get:
      operationId: getDemoDescription
      summary: Fetch the demo's chapterised description markdown.
      description: 'Source: `demoDescriptionUrl(uuid)`, fetched as text and parsed into chapters by src/model/demo-sidebar.ts.  Convention: each chapter begins with a top-level `# ` heading line; a single-heading document yields a single-chapter ("mono") demo.'
      parameters:
        - name: uuid
          in: path
          required: true
          description: The demo's `uuid` (as carried in its catalogue entry).
          schema:
            type: string
        - name: language
          in: path

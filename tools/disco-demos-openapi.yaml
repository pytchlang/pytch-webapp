            application/json:
              schema:
                $ref: "#/components/schemas/DemoCatalogue"
        "404":
          $ref: "#/components/responses/NotFound"
  /{uuid}/{language}/metadata.json:
    x-demo-versions: all
    get:
      operationId: getDemoMetadata
      summary: Fetch a single demo's catalogue entry.
      description: "Source: `demoCatalogueEntryFromServer(uuid)`.  Parsed with `zDemoCatalogueEntry`; returns the same entry shape as one element of the catalogue index."
      parameters:
        - name: uuid
          in: path
          required: true
          description: The demo's `uuid` (as carried in its catalogue entry).
          schema:
            type: string
        - name: language
          in: path
          required: true
          description: Content language code.  Currently always "en"; templated to allow future localisation.
          schema:
            type: string
            default: en
